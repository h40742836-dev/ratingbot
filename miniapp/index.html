<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMR Рейтинг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 12px 16px 24px; font-family: -apple-system, system-ui, sans-serif;
         background: #12161c; color: #fff; }
  .card { background: #1c222b; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .name { font-size: 20px; font-weight: 700; }
  .muted { opacity: .65; font-size: 14px; }
  .big { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 8px; background: #3b82f6; color: #fff; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .btn, .tab { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 15px; cursor: pointer; background: #1c222b; color: inherit; }
  .btn { background: #3b82f6; color: #fff; margin: 4px 6px 4px 0; }
  .btn:disabled { opacity: .5; }
  .tab.on { background: #3b82f6; color: #fff; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid #8884; font-size: 15px; background: transparent; color: inherit; }
  .win { font-weight: 700; }
  .link { cursor: pointer; }
  .bracket { display: flex; overflow-x: auto; padding-bottom: 10px; }
  .round { display: flex; flex-direction: column; min-width: 150px; }
  .rt { font-size: 12px; opacity: .6; text-align: center; padding-bottom: 6px; }
  .cells { flex: 1; display: flex; flex-direction: column; }
  .cell { flex: 1; min-height: 76px; display: flex; align-items: center; position: relative; box-sizing: border-box; }
  .cell.out { padding-right: 28px; }
  .box { flex: 1; min-width: 0; position: relative; border-radius: 8px; background: #1c222b; border: 1px solid #8884; }
  .box .p { padding: 6px 8px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box .p + .p { border-top: 1px solid #8884; }
  .box .p.tap { cursor: pointer; text-decoration: underline; }
  .cell.out::after { content: ''; position: absolute; right: 14px; width: 14px; top: 50%; border-top: 2px solid #8886; }
  .cell.out.top::before { content: ''; position: absolute; right: 14px; top: 50%; height: 50%; border-right: 2px solid #8886; }
  .cell.out.bot::before { content: ''; position: absolute; right: 14px; top: 0; height: 50%; border-right: 2px solid #8886; }
  .box.in::before { content: ''; position: absolute; left: -14px; width: 14px; top: 50%; border-top: 2px solid #8886; }
  .hero { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; }
  .avatar.ph { display: flex; align-items: center; justify-content: center; background: #3b82f6; font-size: 22px; font-weight: 700; }
  .hinfo { min-width: 0; }
  .hside { margin-left: auto; text-align: right; }
  .rank { font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .tile { background: #1c222b; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .tv { font-size: 20px; font-weight: 700; }
  .bar { height: 8px; border-radius: 4px; background: #8883; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: #3b82f6; }
  .w { color: #4ade80; font-weight: 700; }
  .l { color: #f87171; font-weight: 700; }
  .box .p.win { background: #22c55e26; color: #4ade80; font-weight: 700; }
  .box .p.lose { background: #ef444426; color: #f87171; }
  .btn.danger { background: #ef4444; }
  .bonus { font-size: 13px; color: #facc15; margin-top: 4px; }
  .frame { position: relative; width: 64px; flex: none; }
  .fbox { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
  .flab { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .fc { margin-top: 10px; }
  .meet { margin-top: 10px; }
  .frame svg { display: block; width: 100%; height: auto; }
  .fav { position: absolute; left: 20%; top: 26.8%; width: 60%; height: 53.6%; overflow: hidden; border-radius: 5px; }
  .fav .avatar { width: 100%; height: 100%; border-radius: 0; object-fit: cover; font-size: 20px; }
  .trow { display: flex; align-items: center; gap: 12px; }
  .tbody { flex: 1; min-width: 0; }
  .rank { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-weight: 700; }
  .ricon { height: 38px; width: auto; }
  .ricon.sm { height: 22px; vertical-align: middle; }
  .rrow { display: flex; align-items: center; gap: 6px; }
  textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid #8884; font-size: 15px; background: transparent; color: inherit; font-family: inherit; }
  .faqa { white-space: pre-wrap; margin-top: 8px; }
  .qbox { max-height: 260px; overflow-y: auto; margin: 6px 0; }
</style>
</head>

  let tourTab = 'active';
  const STATUS = { registration: 'набор', bracket_ready: 'набор закрыт', running: 'идёт', finished: 'завершён' };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function row(label, value) {
    const r = el('div', 'row');
    r.append(el('span', 'muted', label), el('span', '', String(value)));
    return r;
  }
  function btn(text, fn) {
    const b = el('button', 'btn', text);
    b.onclick = async () => {
      b.disabled = true;
      try { await fn(); } catch (e) { tg.showAlert(e.message); }
      b.disabled = false;
    };
    return b;
  }
  async function api(path, method = 'GET', body) {
    const r = await fetch('/api' + path, {
      method,
      headers: { 'X-Init-Data': tg.initData, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || 'Ошибка');
    return d;
  }
  function setTab(name) {
    document.getElementById('t-profile').classList.toggle('on', name === 'profile');
    document.getElementById('t-tours').classList.toggle('on', name === 'tours');
    document.getElementById('t-top').classList.toggle('on', name === 'top');
    document.getElementById('t-faq').classList.toggle('on', name === 'faq');
    document.getElementById('t-compare').classList.toggle('on', name === 'compare');
    const a = document.getElementById('t-admin');
    if (a) a.classList.toggle('on', name === 'admin');
  }

  const ROLE = { owner: 'создатель', admin: 'admin', player: 'игрок' };
  async function showAdmin() {
    setTab('admin');
    const list = await api('/admin/users');
    app.textContent = '';
    const mf = el('div', 'card');
    mf.append(el('div', 'name', 'Выдать победу вручную'));
    const who = el('select');
    list.filter(u => u.can_reset).forEach(u => { const o = el('option', '', '#' + u.public_id + ' ' + u.nickname); o.value = u.id; who.append(o); });
    const mfmt = el('select');
    ['PB', 'BP', 'PBP'].forEach(c => { const o = el('option', '', c); o.value = c; mfmt.append(o); });
    const chk = el('input'); chk.type = 'checkbox'; chk.style.width = 'auto';
    const lab = el('label', 'muted'); lab.append(chk, ' блестящая победа (+10)');
    mf.append(who, mfmt, lab, el('div'), btn('Записать победу', async () => {
      const ok = await new Promise(res => tg.showConfirm('Записать победу (' + mfmt.value + (chk.checked ? ', блестящая' : '') + ') игроку «' + who.options[who.selectedIndex].text + '»?', res));
      if (!ok) return;
      await api('/admin/manual-win', 'POST', { user_id: Number(who.value), format: mfmt.value, brilliant: chk.checked });
      tg.showAlert('Победа записана');
      showAdmin();
    }));
    if (who.options.length) app.append(mf);
    app.append(el('div', 'muted', 'Игроков: ' + list.length));
    list.forEach(u => {
      const c = el('div', 'card');
      c.append(el('div', 'name', '#' + u.public_id + ' ' + u.nickname + (u.is_banned ? ' (бан)' : '')));
      c.append(el('div', 'muted', ROLE[u.role] + (u.tg_username ? ' · @' + u.tg_username : '') + ' · боёв: ' + u.total_games + ' · MMR: ' + u.mmr));
      if (u.is_banned) c.append(el('div', 'muted', 'Причина бана: ' + (u.ban_reason || 'не указана')));
      const qline = el('div', 'muted', 'Викторины: участий ' + u.quiz_games + ', побед ' + u.quiz_wins);
      c.append(qline);
      const qb = (label, kind, delta) => c.append(btn(label, async () => {
        const r = await api('/admin/users/' + u.id + '/quiz', 'POST', { kind: kind, delta: delta });
        qline.textContent = 'Викторины: участий ' + r.games + ', побед ' + r.wins;
      }));

    const fm = el('div', 'card');
    fm.append(el('div', 'muted', 'По форматам'));
    if (!d.formats.some(f => f.code !== 'QUIZ')) fm.append(el('div', '', 'Боёв ещё не было'));
    d.formats.forEach(f => {
      if (f.code === 'QUIZ') return;
      const wr = f.wins + f.losses ? Math.round(f.wins * 1000 / (f.wins + f.losses)) / 10 : 0;
      fm.append(row(f.code, f.games + ' · ' + f.wins + '/' + f.losses + ' · ' + wr + '%'));
    });
    const qz = d.formats.find(f => f.code === 'QUIZ') || { games: 0, wins: 0 };
    fm.append(row('Всего викторин', qz.games), row('Побед в викторинах', qz.wins));
    app.append(fm);
    app.append(titlesCard(d));
    const pf = el('div', 'card');
    pf.append(row('Любимый персонаж', d.favorite_character || '—'));
    app.append(pf);
  }

  async function showTournaments() {
    setTab('tours');
    const me = await api('/me');
    const list = await api('/tournaments');
    app.textContent = '';
    if (me.role === 'admin' || me.role === 'owner') {
      const f = el('div', 'card');
      const title = el('input'); title.placeholder = 'Название турнира';
      const fmt = el('select');
      ['PB', 'BP', 'PBP'].forEach(c => { const o = el('option', '', c); o.value = c; fmt.append(o); });
      const lim = el('select');
      [['', 'Без ограничения мест'], ['4', '4 места'], ['8', '8 мест'], ['16', '16 мест'], ['32', '32 места'], ['custom', 'Своё число…']]
        .forEach(([v, n]) => { const o = el('option', '', n); o.value = v; lim.append(o); });
      const places = el('input'); places.type = 'number'; places.placeholder = 'Сколько мест'; places.style.display = 'none';
      lim.onchange = () => { places.style.display = lim.value === 'custom' ? '' : 'none'; };
      f.append(title, fmt, lim, places, btn('Создать турнир', async () => {
        const mp = lim.value === 'custom' ? Number(places.value) : (lim.value ? Number(lim.value) : null);
        const r = await api('/tournaments', 'POST', { title: title.value, format: fmt.value, max_players: mp });
        showTournament(r.id);
      }));
      app.append(f);
    }
    const done = list.filter(t => t.status === 'finished');
    const active = list.filter(t => t.status !== 'finished');
    const tb = el('div', 'tabs');
    [['active', 'Активные (' + active.length + ')'], ['done', 'Завершённые (' + done.length + ')']].forEach(([k, n]) => {
      const b = el('button', 'tab' + (tourTab === k ? ' on' : ''), n);
      b.onclick = () => { tourTab = k; showTournaments().catch(e => { app.textContent = e.message; }); };
      tb.append(b);
    });
    app.append(tb);
    const shown = tourTab === 'done' ? done : active;
    if (!shown.length) app.append(el('div', 'muted', tourTab === 'done' ? 'Завершённых турниров пока нет' : 'Активных турниров нет'));
    shown.forEach(t => {
      const c = el('div', 'card link');
      c.append(el('div', 'name', t.title), el('div', 'muted', t.format + ' · ' + STATUS[t.status] + ' · игроков: ' + t.players + (t.max_players ? '/' + t.max_players : '')));
      c.onclick = () => showTournament(t.id);
      app.append(c);
    });
  }

  function manualSeed(t) {
    const n = t.registered.length;
    let size = 1; while (size < n) size *= 2;
    const needPairs = size / 2, byes = size - n;
    const pairs = []; let pending = null;
    const nick = pid => (t.registered.find(p => p.id === pid) || {}).nickname || '';
    const draw = () => {
      app.textContent = '';
      app.append(btn('← Назад', () => showTournament(t.id)));
      const info = el('div', 'card');
      info.append(el('div', 'name', 'Ручная расстановка'),
        el('div', 'muted', 'Нажми двух игроков, чтобы поставить их в пару. Нужно пар: ' + needPairs + (byes ? ' (проходов без игры: ' + byes + ')' : '')));
      app.append(info);
      const used = new Set(pairs.flat().filter(x => x !== null));
      if (pending !== null) used.add(pending);
      pairs.forEach((p, i) => app.append(el('div', 'card', (i + 1) + '. ' + nick(p[0]) + (p[1] === null ? ' — проход' : ' vs ' + nick(p[1])))));
      const left = t.registered.filter(p => !used.has(p.id));
      const c = el('div', 'card');
      c.append(el('div', 'muted', pending !== null ? 'Первый: ' + nick(pending) + '. Выбери соперника:' : 'Свободные игроки (' + left.length + ')'));
      left.forEach(p => c.append(btn(p.nickname, () => {
        if (pending === null) pending = p.id; else { pairs.push([pending, p.id]); pending = null; }
        draw();
      })));
      if (pending !== null && byes > pairs.filter(p => p[1] === null).length) {
        c.append(btn('Проход без игры', () => { pairs.push([pending, null]); pending = null; draw(); }));
      }
      c.append(btn('Сбросить', () => { pairs.length = 0; pending = null; draw(); }));
      app.append(c);
      if (!left.length && pending === null) {
        app.append(btn('Построить сетку', async () => {
          await api('/tournaments/' + t.id + '/bracket', 'POST', { mode: 'manual', pairs });
          showTournament(t.id);
        }));
      }
    };
    draw();
  }

  async function showTournament(id) {
    setTab('tours');
    const t = await api('/tournaments/' + id);
    app.textContent = '';
    app.append(btn('← Все турниры', showTournaments));
    const head = el('div', 'card');
    head.append(el('div', 'name', t.title), el('div', 'muted', t.format + ' · ' + STATUS[t.status]));
    app.append(head);
    if (t.is_admin && t.status !== 'finished') {
      const cb = btn('Отменить турнир', async () => {
        const ok = await new Promise(res => tg.showConfirm('Отменить турнир «' + t.title + '»?', res));
        if (!ok) return;
        await api('/tournaments/' + id + '/cancel', 'POST');
        showTournaments();
      });
      cb.classList.add('danger');
      app.append(cb);
    }

    if (t.status === 'registration' || t.status === 'bracket_ready') {
      const c = el('div', 'card');
      c.append(el('div', 'muted', 'Участники (' + t.registered.length + (t.max_players ? '/' + t.max_players : '') + ')'));
      t.registered.forEach(p => c.append(row(p.nickname, '#' + p.public_id)));
      const joined = t.registered.some(p => p.id === t.me);
      const full = t.max_players && t.registered.length >= t.max_players;
      if (t.status === 'registration') {
        if (!joined && !full) c.append(btn('Записаться', async () => { await api('/tournaments/' + id + '/register', 'POST'); showTournament(id); }));
        if (t.is_admin) c.append(btn('Закрыть набор', async () => { await api('/tournaments/' + id + '/close', 'POST'); showTournament(id); }));
      } else {
        c.append(el('div', 'muted', t.is_admin ? 'Набор закрыт. Как расставить сетку?' : 'Набор закрыт, ждём сетку'));
        if (t.is_admin) {
          c.append(btn('Автоматически', async () => { await api('/tournaments/' + id + '/bracket', 'POST', { mode: 'auto' }); showTournament(id); }));
          c.append(btn('Расставить вручную', async () => manualSeed(t)));
        }
      }
      app.append(c);
      return;
    }
    const maxRound = Math.max(...t.matches.map(m => m.round));
    let bright = false;
    if (t.is_admin && t.status === 'running') {
      const lab = el('label', 'muted');
      const chk = el('input'); chk.type = 'checkbox'; chk.style.width = 'auto';
      chk.onchange = () => { bright = chk.checked; };
      lab.append(chk, ' Следующая победа блестящая (+10)');
      app.append(lab, el('div', 'muted', 'Нажми на имя победителя'));
    }
    const wrap = el('div', 'bracket');
    for (let r = 1; r <= maxRound; r++) {
      const col = el('div', 'round');
      col.append(el('div', 'rt', r === maxRound ? 'Финал' : 'Раунд ' + r));
      const list = el('div', 'cells');
      t.matches.filter(m => m.round === r).forEach((m, i) => {
        const cell = el('div', 'cell' + (r < maxRound ? ' out ' + (i % 2 === 0 ? 'top' : 'bot') : ''));
        const box = el('div', 'box' + (r > 1 ? ' in' : ''));
        const canPlay = t.is_admin && !m.winner_id && m.player1_id && m.player2_id;
        [[m.player1_id, m.p1_name], [m.player2_id, m.p2_name]].forEach(([pid, name]) => {
          const label = name || (r === 1 && m.player1_id ? 'проход' : '—');
          const p = el('div', 'p' + (m.winner_id ? (m.winner_id === pid ? ' win' : (pid ? ' lose' : '')) : '') + (canPlay ? ' tap' : ''), label);
          if (canPlay) p.onclick = () => tg.showConfirm('Победил ' + name + '?', async ok => {
            if (!ok) return;
            try { await api('/matches/' + m.id + '/winner', 'POST', { winner_id: pid, brilliant: bright }); showTournament(id); }
            catch (e) { tg.showAlert(e.message); }
          });
          box.append(p);
        });
        cell.append(box);
        list.append(cell);
      });
      col.append(list);
      wrap.append(col);
    }
    app.append(wrap);
  }

  document.getElementById('t-profile').onclick = () => showProfile().catch(e => app.textContent = e.message);
  document.getElementById('t-tours').onclick = () => showTournaments().catch(e => app.textContent = e.message);
  document.getElementById('t-top').onclick = () => showTop().catch(e => { app.textContent = e.message; });
  document.getElementById('t-faq').onclick = () => showFaq().catch(e => { app.textContent = e.message; });
  document.getElementById('t-compare').onclick = () => showCompare().catch(e => { app.textContent = e.message; });

  if (!tg.initData) app.textContent = 'Открой это окно через бота в Телеграме.';
  else {
    const starts = { profile: showProfile, tours: showTournaments, top: showTop, faq: showFaq, compare: showCompare };
    const startTab = new URLSearchParams(location.search).get('tab');
    (starts[startTab] || showProfile)().catch(e => app.textContent = e.message);
    api('/me').then(me => {
      if (me.role === 'admin' || me.role === 'owner') {
        const b = el('button', 'tab', 'Админ'); b.id = 't-admin';
        b.onclick = () => showAdmin().catch(e => { app.textContent = e.message; });
        document.querySelector('.tabs').append(b);
      }
    }).catch(() => {});
  }
</script>
</body>
</html>
